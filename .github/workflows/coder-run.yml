name: Run a coder turn in the container (BEB-9809)

# The headless coder route (Fable m73485 #2): GitHub Actions drives the abilifi-linux sandbox, so no Intent app,
# no laptop and no person is involved. The sandbox's provision/exec are FAIL-CLOSED (503 with no LINUX_GATE).
# Per run: a fresh random gate is generated; only its SHA-256 goes into D1 (run_gates, expiry 40 min); the run uses it and
# DELETES its own row at the end — nobody holds a valid gate between runs, and runs no longer cancel each other (parallel). The model key comes from
# the vault by name (openrouter:key) and is never printed. Secrets are masked in logs.

on:
  # Any agent with git access sends a job by committing one file under jobs/ (the file's text is the prompt).
  # Interim until the coder pulls tickets itself (BEB-9847).
  push:
    branches: [master]
    paths: ['jobs/**']
  workflow_dispatch:
    inputs:
      prompt:
        description: "The task the coder runs (opencode run <prompt>)"
        required: true
        default: "Create the file /workspace/hello.txt containing exactly: coder-ok-from-container. Then print the file."

# No shared concurrency group: each run has its OWN gate (a hashed row in D1), so runs can be parallel (BEB-9847 C6, Fable m73640).

env:
  CLOUDFLARE_ACCOUNT_ID: e7eb1ac8384be6f4f05e8f95c4b3240a
  VAULT_URL: https://abilifi-vault.alex-rollin.workers.dev
  WORKER_URL: https://abilifi-linux.nlrollin02.workers.dev

jobs:
  coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pick the job prompt (dispatch input, or the job file just pushed)
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PROMPT:-}" ]; then P="$INPUT_PROMPT"; else
            F="$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- jobs/ | head -1)"
            [ -n "$F" ] || { echo "no new job file in this push" >&2; exit 1; }
            echo "job file: $F"; P="$(cat "$F")"
          fi
          # Optional header (top of the job text, ends at the first non-header line):
          #   repo: owner/name   base: master   branch: coder/x   ticket: BEB-123
          # With a repo the coder clones it, works on a NEW branch (never the base) and pushes that branch.
          hdr() { printf '%s\n' "$P" | awk 'BEGIN{h=1} h && /^(repo|base|branch|ticket):/ {print; next} {h=0}' | sed -n "s/^$1:[[:space:]]*//p" | head -1 | tr -d '\r'; }
          JOB_REPO="$(hdr repo)"; JOB_BASE="$(hdr base)"; JOB_BRANCH="$(hdr branch)"; JOB_TICKET="$(hdr ticket)"
          P="$(printf '%s\n' "$P" | awk 'BEGIN{h=1} h && /^(repo|base|branch|ticket):/ {next} {h=0; print}' | sed '1{/^[[:space:]]*$/d}')"
          [ -n "$(printf '%s' "$P" | tr -d '[:space:]')" ] || { echo "VERDICT: FAILED — empty job prompt, nothing to run" >&2; exit 1; }
          [ -z "$JOB_REPO" ] || printf '%s' "$JOB_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "bad repo: $JOB_REPO" >&2; exit 1; }
          JOB_BASE="${JOB_BASE:-master}"
          JOB_BRANCH="${JOB_BRANCH:-coder/${JOB_TICKET:-job}-$(date -u +%Y%m%d%H%M%S)}"
          printf '%s' "$JOB_BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "bad branch: $JOB_BRANCH" >&2; exit 1; }
          case "$JOB_BRANCH" in master|main|"$JOB_BASE") echo "refusing to push the base branch ($JOB_BRANCH)" >&2; exit 1;; esac
          echo "job: repo=${JOB_REPO:-none} base=$JOB_BASE branch=$JOB_BRANCH ticket=${JOB_TICKET:-none}"
          { echo "JOB_REPO=$JOB_REPO"; echo "JOB_BASE=$JOB_BASE"; echo "JOB_BRANCH=$JOB_BRANCH"; echo "JOB_TICKET=$JOB_TICKET"; } >> "$GITHUB_ENV"
          { echo 'JOB_PROMPT<<__EOP__'; printf '%s\n' "$P"; echo '__EOP__'; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci || npm install

      - name: Get credentials from the vault by name
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VAULT_KEY:-}" ] || { echo "MISSING: VAULT_KEY repo secret" >&2; exit 1; }
          get() {
            curl -sS --fail-with-body -X POST "$VAULT_URL/vault/checkout-self" \
              -H "Authorization: Bearer $VAULT_KEY" -H "Content-Type: application/json" \
              -d "{\"name\":\"$1\"}" | jq -r '.token // .value // empty'
          }
          KEY="$(get cf:keeper-global-key)"; EMAIL="$(get cf:keeper-email)"; ORK="$(get openrouter:key)"
          [ -n "$KEY" ] && [ -n "$EMAIL" ] && [ -n "$ORK" ] || { echo "MISSING: a vault cred came back empty" >&2; exit 1; }
          for v in "$KEY" "$EMAIL" "$ORK"; do echo "::add-mask::$v"; done
          { echo "CLOUDFLARE_API_KEY=$KEY"; echo "CLOUDFLARE_EMAIL=$EMAIL"; echo "OR_KEY=$ORK"; } >> "$GITHUB_ENV"
          echo "creds loaded (lengths: cf-key ${#KEY}, email ${#EMAIL}, model-key ${#ORK})"
          if [ -n "${JOB_REPO:-}" ]; then
            GHT="$(get GITHUB_TOKEN)"
            [ -n "$GHT" ] || { echo "MISSING: vault GITHUB_TOKEN empty (job needs repo access)" >&2; exit 1; }
            echo "::add-mask::$GHT"; echo "GHTOK=$GHT" >> "$GITHUB_ENV"
            echo "github token loaded for $JOB_REPO (length ${#GHT})"
          fi

      - name: Open a gate for THIS run only (own random value; only its SHA-256 is stored, with an expiry)
        run: |
          set -euo pipefail
          GATE="$(openssl rand -hex 32)"
          echo "::add-mask::$GATE"
          echo "GATE=$GATE" >> "$GITHUB_ENV"
          HASH="$(printf '%s' "$GATE" | sha256sum | cut -d' ' -f1)"
          echo "GATE_HASH=$HASH" >> "$GITHUB_ENV"
          EXP=$(( $(date +%s) + 2400 ))
          npx wrangler d1 execute abilifi-linux-db --remote --command "CREATE TABLE IF NOT EXISTS run_gates(hash TEXT PRIMARY KEY, exp INTEGER NOT NULL); DELETE FROM run_gates WHERE exp < $(date +%s); INSERT OR REPLACE INTO run_gates(hash, exp) VALUES('$HASH', $EXP);"
          # with the gate header the status route answers 404 (gate + org auth pass, unknown id); a bad gate answers 401
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "X-Linux-Gate: $GATE" -H 'Authorization: Bearer bb_000coder' "$WORKER_URL/linux/status/x" || true)"
            echo "gate check $i: with-gate -> $code"
            if [ "$code" = "404" ]; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 3 ] && break
            sleep 3
          done
          [ "$ok" -ge 3 ] || { echo "gate never took effect" >&2; exit 1; }

      - name: Provision + run the coder turn (retries only fast failures where nothing ran)
        env:
          PROMPT: ${{ env.JOB_PROMPT }}
        run: bash coder/run-job.sh

      - name: Destroy the sandbox (free the container, even on failure)
        if: always()
        run: |
          [ -n "${SANDBOX_ID:-}" ] || { echo "no sandbox to destroy"; exit 0; }
          curl -sS --max-time 120 -X POST "$WORKER_URL/linux/destroy" \
            -H "X-Linux-Gate: $GATE" -H "Authorization: Bearer bb_000coder" -H 'Content-Type: application/json' \
            -d "{\"id\":\"$SANDBOX_ID\"}" || true
          echo

      - name: Close this run's gate (delete only its own row)
        if: always()
        run: |
          [ -n "${GATE_HASH:-}" ] || { echo "no gate to close"; exit 0; }
          npx wrangler d1 execute abilifi-linux-db --remote --command "DELETE FROM run_gates WHERE hash = '$GATE_HASH';" || true
          echo "this run's gate closed; other runs' gates untouched"
